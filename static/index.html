<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #edf0f5;
      --panel: #ffffff;
      --ink: #18202f;
      --muted: #5b6578;
      --line: #d5dae3;
      --accent: #2848b8;
      --accent-ink: #ffffff;
      --user-bg: #e3e9f7;
      --hl: #f8e78a;
      --error: #b3261e;
      --ok: #1e7a4c;
      --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
      --sans: system-ui, "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f131b;
        --panel: #171c27;
        --ink: #e7eaf1;
        --muted: #9aa3b5;
        --line: #2a3142;
        --accent: #8ca4ff;
        --accent-ink: #0f131b;
        --user-bg: #222b41;
        --hl: rgba(248, 231, 138, 0.24);
        --error: #ff8a80;
        --ok: #6cd39a;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 var(--sans);
    }

    button,
    input,
    textarea {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Layout */
    .app {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 20px;
      height: 100dvh;
      padding: 20px;
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 28px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .side h2 {
      font-size: 0.9375rem;
      font-weight: 600;
      margin: 0 0 8px;
    }

    .side p.hint {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.875rem;
    }

    /* Brand */
    .brand h1 {
      font: 600 1.625rem/1.2 var(--serif);
      margin: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .dot.ok {
      background: var(--ok);
    }

    .dot.bad {
      background: var(--error);
    }

    /* Upload */
    .drop {
      display: block;
      border: 1.5px dashed var(--line);
      border-radius: 12px;
      padding: 20px 14px;
      text-align: center;
      cursor: pointer;
      background: var(--panel);
    }

    .drop:hover,
    .drop.over {
      border-color: var(--accent);
    }

    .drop.over {
      background: color-mix(in srgb, var(--accent) 8%, var(--panel));
    }

    .drop:focus-within {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .drop strong {
      display: block;
      font-weight: 600;
    }

    .drop span {
      color: var(--muted);
      font-size: 0.875rem;
    }

    #upload-status {
      min-height: 1.5em;
      margin: 10px 0 0;
      font-size: 0.875rem;
      color: var(--muted);
    }

    #upload-status.ok {
      color: var(--ok);
    }

    #upload-status.error {
      color: var(--error);
    }

    #docs {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
    }

    #docs li {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      overflow-wrap: anywhere;
    }

    #docs .meta {
      display: block;
      color: var(--muted);
      font-size: 0.8125rem;
    }

    /* Session */
    #session-id {
      display: block;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-bottom: 10px;
    }

    .btn-quiet {
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
    }

    .btn-quiet:hover:not(:disabled) {
      border-color: var(--error);
      color: var(--error);
    }

    .btn-quiet:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* Chat */
    .chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px clamp(16px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .empty {
      margin: auto;
      max-width: 28rem;
      text-align: center;
    }

    .empty h2 {
      font: 600 1.375rem/1.3 var(--serif);
      margin: 0 0 8px;
    }

    .empty p {
      margin: 0;
      color: var(--muted);
    }

    .msg {
      width: 100%;
      max-width: 40rem;
      margin: 0 auto;
    }

    .msg.user {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .bubble {
      margin: 0;
      padding: 10px 14px;
      max-width: 85%;
      background: var(--user-bg);
      border-radius: 16px 16px 4px 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .rewrite {
      margin: 6px 4px 0;
      max-width: 85%;
      text-align: right;
      color: var(--muted);
      font-size: 0.8125rem;
      overflow-wrap: anywhere;
    }

    .answer {
      margin: 0;
      font: 400 1.0625rem/1.65 var(--serif);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .sources {
      margin-top: 14px;
      font-size: 0.875rem;
    }

    .sources summary {
      cursor: pointer;
      color: var(--muted);
      width: max-content;
    }

    .sources ul {
      list-style: none;
      margin: 10px 0 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .sources li {
      border-left: 3px solid var(--line);
      padding-left: 12px;
    }

    .where {
      color: var(--muted);
      font-size: 0.8125rem;
    }

    .snippet {
      margin: 2px 0 0;
      font: 400 0.9375rem/1.55 var(--serif);
    }

    mark {
      background: var(--hl);
      color: inherit;
      padding: 0 2px;
      border-radius: 2px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .note {
      width: 100%;
      max-width: 40rem;
      margin: 0 auto;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .note.error {
      color: var(--error);
    }

    .pending {
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        opacity: 0.4;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pending {
        animation: none;
      }
    }

    /* Composer */
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 14px clamp(16px, 4vw, 40px) 18px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .composer textarea {
      flex: 1;
      resize: none;
      max-height: 160px;
      padding: 11px 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .composer textarea::placeholder {
      color: var(--muted);
    }

    .composer button {
      min-height: 44px;
      padding: 0 22px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
      cursor: pointer;
    }

    .composer button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100dvh;
        padding: 14px;
        gap: 16px;
      }

      .side {
        overflow: visible;
        gap: 18px;
        padding-right: 0;
      }

      .chat-panel {
        min-height: 70dvh;
      }

      .composer {
        position: sticky;
        bottom: 0;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="side">
      <header class="brand">
        <h1>PDF Chat</h1>
        <div class="status"><span class="dot" id="dot"></span><span id="status-text">Checking server…</span></div>
      </header>

      <section aria-labelledby="docs-title">
        <h2 id="docs-title">Documents</h2>
        <label class="drop" id="drop">
          <input class="sr-only" type="file" id="file"
            accept="application/pdf,.pdf,text/plain,.txt,application/csv,.csv,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.docx,application/vnd.openxmlformats-officedocument.presentationml.presentation,.pptx"
            multiple>
          <strong>Choose a text file</strong>
          <span>or drop it here</span>
        </label>
        <p id="upload-status" role="status"></p>
        <ul id="docs"></ul>
      </section>

      <section aria-labelledby="session-title">
        <h2 id="session-title">Session</h2>
        <p class="hint">Follow-up questions are remembered under this ID.</p>
        <output id="session-id"></output>
        <button type="button" class="btn-quiet" id="delete-session">Delete session</button>
      </section>
    </aside>

    <main class="chat-panel">
      <div id="chat" class="chat" role="log" aria-live="polite" aria-label="Conversation"></div>
      <form id="form" class="composer">
        <label for="question" class="sr-only">Your question</label>
        <textarea id="question" rows="1" placeholder="Ask about your document"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>
  </div>

  <script>
    const els = {
      chat: document.getElementById("chat"),
      form: document.getElementById("form"),
      question: document.getElementById("question"),
      send: document.getElementById("send"),
      file: document.getElementById("file"),
      drop: document.getElementById("drop"),
      uploadStatus: document.getElementById("upload-status"),
      docs: document.getElementById("docs"),
      sessionId: document.getElementById("session-id"),
      deleteBtn: document.getElementById("delete-session"),
      dot: document.getElementById("dot"),
      statusText: document.getElementById("status-text"),
    };

    let sessionId = makeId();
    let busy = false;

    /* ---------- helpers ---------- */

    function makeId() {
      return "s-" + Math.random().toString(36).slice(2, 8);
    }

    async function readJson(res) {
      const text = await res.text();
      try { return JSON.parse(text); } catch { return { detail: text }; }
    }

    // FastAPI sends { detail: "..." } for our own errors.
    // For crashes it sends plain "Internal Server Error", so we show a clearer message.
    function errorText(data, fallback) {
      const d = data && data.detail;
      if (Array.isArray(d)) return d.map((x) => x.msg).join(" ");
      if (typeof d === "string" && d && d !== "Internal Server Error") return d;
      return fallback;
    }

    const SERVER_ERROR =
      "The server hit an error. If you asked many questions quickly, wait a minute and try again. The terminal shows the details.";
    const OFFLINE_ERROR = "Could not reach the server. Check that uvicorn is still running.";

    function scrollDown() {
      els.chat.scrollTop = els.chat.scrollHeight;
    }

    // Very small, safe formatter: turns "* item" into a bullet and **text** into bold.
    function renderText(el, text) {
      const cleaned = text.replace(/^\s*[*-]\s+/gm, "• ");
      cleaned.split(/(\*\*[^*\n]+\*\*)/g).forEach((part) => {
        if (part.length > 4 && part.startsWith("**") && part.endsWith("**")) {
          const strong = document.createElement("strong");
          strong.textContent = part.slice(2, -2);
          el.append(strong);
        } else {
          el.append(document.createTextNode(part));
        }
      });
    }

    /* ---------- chat view ---------- */

    function showEmpty(title, text) {
      const box = document.createElement("div");
      box.className = "empty";
      const h = document.createElement("h2");
      h.textContent = title;
      const p = document.createElement("p");
      p.textContent = text;
      box.append(h, p);
      els.chat.replaceChildren(box);
    }

    function clearEmpty() {
      const e = els.chat.querySelector(".empty");
      if (e) e.remove();
    }

    function addUser(text) {
      clearEmpty();
      const wrap = document.createElement("div");
      wrap.className = "msg user";
      const bubble = document.createElement("p");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.append(bubble);
      els.chat.append(wrap);
      scrollDown();
      return wrap;
    }

    // Shows how a follow-up was rewritten before searching the document.
    function addRewrite(wrap, original, rewritten) {
      if (!rewritten) return;
      if (rewritten.trim().toLowerCase() === original.trim().toLowerCase()) return;
      const note = document.createElement("p");
      note.className = "rewrite";
      note.textContent = "Searched for: " + rewritten;
      wrap.append(note);
    }

    function addNote(text, kind) {
      const note = document.createElement("p");
      note.className = "note" + (kind ? " " + kind : "");
      note.textContent = text;
      els.chat.append(note);
      scrollDown();
      return note;
    }

    function addAnswer(data) {
      const wrap = document.createElement("div");
      wrap.className = "msg bot";

      const answer = document.createElement("p");
      answer.className = "answer";
      renderText(answer, String(data.answer || ""));
      wrap.append(answer);

      const sources = Array.isArray(data.sources) ? data.sources : [];
      if (sources.length) {
        const details = document.createElement("details");
        details.className = "sources";
        const summary = document.createElement("summary");
        summary.textContent = "Sources (" + sources.length + " passages)";
        const list = document.createElement("ul");
        sources.forEach((s) => {
          const li = document.createElement("li");
          const where = document.createElement("div");
          where.className = "where";
          where.textContent = s.file + ", page " + s.page;
          const snippet = document.createElement("p");
          snippet.className = "snippet";
          const mark = document.createElement("mark");
          const raw = String(s.snippet || "").trim();
          mark.textContent = raw + (raw.length >= 500 ? "…" : "");
          snippet.append(mark);
          li.append(where, snippet);
          list.append(li);
        });
        details.append(summary, list);
        wrap.append(details);
      }

      els.chat.append(wrap);
      scrollDown();
    }

    function setBusy(value) {
      busy = value;
      els.send.disabled = value;
    }

    /* ---------- ask ---------- */

    async function ask(question) {
      const userMsg = addUser(question);
      const pending = addNote("Reading the document…", "pending");
      setBusy(true);
      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question, session_id: sessionId }),
        });
        const data = await readJson(res);
        pending.remove();
        if (!res.ok) {
          addNote(errorText(data, SERVER_ERROR), "error");
          return;
        }
        addRewrite(userMsg, question, data.standalone_question);
        addAnswer(data);
      } catch (err) {
        pending.remove();
        addNote(OFFLINE_ERROR, "error");
      } finally {
        setBusy(false);
        els.question.focus();
      }
    }

    function autosize() {
      els.question.style.height = "auto";
      els.question.style.height = Math.min(els.question.scrollHeight, 160) + "px";
    }

    els.question.addEventListener("input", autosize);
    els.question.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        els.form.requestSubmit();
      }
    });
    els.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = els.question.value.trim();
      if (!q || busy) return;
      els.question.value = "";
      autosize();
      await ask(q);
    });

    /* ---------- upload ---------- */

    function setUploadStatus(text, kind) {
      els.uploadStatus.textContent = text;
      els.uploadStatus.className = kind || "";
    }

    function addDoc(info) {
      const existing = Array.from(els.docs.children).find((li) => li.dataset.name === info.filename);
      const li = existing || document.createElement("li");
      li.dataset.name = info.filename;
      li.replaceChildren();
      const name = document.createElement("span");
      name.textContent = info.filename;
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = info.pages + " pages, " + info.chunks + " chunks";
      li.append(name, meta);
      if (!existing) els.docs.append(li);
    }

    async function uploadFile(file) {
    const validExtensions = [".pdf", ".txt", ".csv", ".doc", ".docx", ".ppt", ".pptx", ".html", ".md", ".epub"];
    const fileName = file.name.toLowerCase();
    const isValid = validExtensions.some(ext => fileName.endsWith(ext));

    if (!isValid) {
      setUploadStatus("Unsupported file format.", "error");
      return;
    }
    
    setUploadStatus("Reading " + file.name + "…", "");
    els.file.disabled = true;
    const body = new FormData();
    body.append("file", file);
    try {
      // INCLUDE session_id here so the backend indexes it into the correct isolated collection
      const res = await fetch("/upload?session_id=" + encodeURIComponent(sessionId), { 
        method: "POST", 
        body: body 
      });
      const data = await readJson(res);
      if (!res.ok) throw new Error(errorText(data, SERVER_ERROR));
      addDoc(data);
      setUploadStatus(file.name + " is ready. Ask a question about it.", "ok");
    } catch (err) {
      const message = err instanceof TypeError ? OFFLINE_ERROR : err.message;
      setUploadStatus(message, "error");
    } finally {
      els.file.disabled = false;
    }
  }
  
    async function uploadAll(files) {
      for (const f of files) await uploadFile(f);
    }

    els.file.addEventListener("change", () => {
      const files = Array.from(els.file.files);
      els.file.value = "";
      if (files.length) uploadAll(files);
    });

    ["dragenter", "dragover"].forEach((type) =>
      els.drop.addEventListener(type, (e) => {
        e.preventDefault();
        els.drop.classList.add("over");
      })
    );
    ["dragleave", "drop"].forEach((type) =>
      els.drop.addEventListener(type, (e) => {
        e.preventDefault();
        els.drop.classList.remove("over");
      })
    );
    els.drop.addEventListener("drop", (e) => {
      const files = Array.from(e.dataTransfer.files);
      if (files.length) uploadAll(files);
    });
    // Stop the browser from opening a PDF that is dropped outside the drop area.
    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => e.preventDefault());

    /* ---------- session ---------- */

    els.deleteBtn.addEventListener("click", async () => {
    els.deleteBtn.disabled = true;
    try {
      const res = await fetch("/sessions/" + encodeURIComponent(sessionId), { method: "DELETE" });
      if (!res.ok) throw new Error("delete failed");
      
      // Generate new session ID and update DOM
      sessionId = makeId();
      els.sessionId.textContent = sessionId;
      
      // Clear chat panel back to the welcoming empty state
      showEmpty("New session started", "Your session has been reset. Ask a question about your uploaded documents or start fresh!");
      
      // Optional: Clear upload status message
      setUploadStatus("", "");
    } catch (err) {
      addNote("Could not delete the session. Check that the server is running.", "error");
    } finally {
      els.deleteBtn.disabled = false;
    }
  });

    /* ---------- start ---------- */

    async function checkHealth() {
      try {
        const res = await fetch("/health");
        if (!res.ok) throw new Error("bad status");
        els.dot.className = "dot ok";
        els.statusText.textContent = "Server connected";
      } catch (err) {
        els.dot.className = "dot bad";
        els.statusText.textContent = "Server not reachable";
      }
    }

    els.sessionId.textContent = sessionId;
    showEmpty("Ask your documents", "Upload a document, then ask a question about it. Follow-ups like “explain that more simply” work too.");
    checkHealth();
  </script>
</body>

</html>
